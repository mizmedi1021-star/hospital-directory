<title>미즈메디 내선번호</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="병원내선번호">
<meta name="theme-color" content="#0f4c4f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* layout: sticky search header + department-grouped list with favorites */
:root{
  --bg:#f5f3ef; --surface:#ffffff; --surface-2:#ececE6; --ink:#1b2322; --muted:#6b706d;
  --accent:#0f4c4f; --accent-ink:#ffffff; --line:#e3e0d8; --chip:#eceee9; --chip-active:#0f4c4f;
  --groupbg:#e3f0ec; --num:#0f4c4f; --star:#c9ccc4; --star-on:#e8b23d;
  color-scheme:light;
  font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}
body.text-lg{ font-size:108% }
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}

header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:var(--bg); padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-bottom:10px; border-bottom:1px solid var(--line);
}
.titlerow{display:flex; align-items:center; gap:8px; margin-bottom:10px}
h1{font-size:19px; font-weight:800; letter-spacing:.1px; margin:0; flex:1; min-width:0}
.asof{
  flex:none; font-size:11.5px; font-weight:600; color:var(--muted); background:var(--chip);
  padding:4px 9px; border-radius:999px;
}
.fontbtn{
  flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  width:30px;height:30px; border-radius:9px; font-weight:800; font-size:13px; cursor:pointer;
}

.searchbar{
  display:flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--line); border-radius:14px; padding:10px 12px;
}
.searchbar svg{flex:none; color:var(--muted)}
.searchbar input{
  flex:1; min-width:0; border:none; outline:none; background:transparent; color:var(--ink);
  font:inherit; font-size:16px;
}
.searchbar input::placeholder{color:var(--muted)}
.clearbtn{
  flex:none; border:none; background:var(--chip); color:var(--muted); width:22px;height:22px;
  border-radius:50%; font-size:13px; line-height:1; cursor:pointer; display:none;
}
.searchbar.has-text .clearbtn{display:block}

.chips{display:flex; gap:6px; overflow-x:auto; margin-top:10px; padding-bottom:2px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none; font-size:12.5px; font-weight:700; color:var(--muted); background:var(--chip);
  border:1px solid transparent; padding:7px 13px; border-radius:999px; cursor:pointer; white-space:nowrap;
  display:flex; align-items:center; gap:4px;
}
.chip[aria-pressed="true"]{background:var(--chip-active); color:var(--accent-ink); border-color:transparent}
.chip .star{color:var(--star-on); font-size:12px}
.chip[aria-pressed="true"] .star{color:var(--accent-ink)}

.meta{font-size:12.5px; color:var(--muted); margin:10px 2px 6px}
.meta b{color:var(--ink); font-variant-numeric:tabular-nums}

main{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}

.grouphead{
  display:flex; align-items:baseline; gap:8px; background:var(--groupbg); border-radius:12px;
  padding:10px 14px; margin-top:14px;
}
.grouphead .dname{font-size:15.5px; font-weight:800}
.grouphead .dsec{font-size:11.5px; color:var(--muted); font-weight:600}
.grouphead .dcount{margin-left:auto; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}

.row{
  display:flex; align-items:center; gap:10px; background:var(--surface);
  border-bottom:1px solid var(--line); padding:14px 4px;
}
.row:last-child{border-bottom:none}
.rinfo{flex:1; min-width:0}
.rname{font-size:16.5px; font-weight:800; line-height:1.3; overflow-wrap:anywhere}
.rsub{font-size:12.5px; color:var(--muted); margin-top:3px; overflow-wrap:anywhere; line-height:1.4}
.rsub .seg + .seg::before{content:" · "}

a.bignum{
  flex:none; text-decoration:none; color:var(--num); font-weight:800; font-size:21px;
  font-variant-numeric:tabular-nums; letter-spacing:.2px;
}
span.bignum{flex:none; color:var(--muted); opacity:.5; font-weight:800; font-size:21px; font-variant-numeric:tabular-nums}
button.starbtn{
  flex:none; border:none; background:transparent; color:var(--star); width:30px;height:30px;
  display:flex;align-items:center;justify-content:center; cursor:pointer; padding:0;
}
button.starbtn svg{width:21px;height:21px}
button.starbtn.on{color:var(--star-on)}

.empty{text-align:center; color:var(--muted); padding:48px 16px; font-size:14px; line-height:1.7}
.empty b{display:block; font-size:15px; color:var(--ink); margin-bottom:4px}

.toast{
  position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); font-size:13px; padding:9px 16px; border-radius:999px;
  opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}

footer.note{
  max-width:720px;margin:0 auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
  font-size:11.5px; color:var(--muted); text-align:center; line-height:1.6;
}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

<header class="top">
  <div class="wrap">
    <div class="titlerow">
      <h1>미즈메디 내선번호</h1>
      <span class="asof" id="asOf"></span>
      <button class="fontbtn" id="fontBtn" type="button" aria-label="글자 크게/작게">가</button>
    </div>
    <div class="searchbar" id="searchbar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="이름 · 부서 · 번호 · 초성(ㄱㅈㅎ)" aria-label="내선번호 검색">
      <button class="clearbtn" id="clearBtn" aria-label="지우기" type="button">✕</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="meta"><b id="metaCount">0건</b></div>
  </div>
</header>

<main class="wrap">
  <div id="list"></div>
  <div class="empty" id="empty" hidden><b>검색 결과가 없어요</b>이름, 부서명, 초성 또는 내선번호로 다시 찾아보세요.</div>
</main>

<footer class="note">
  번호를 누르면 02-2007-XXXX(내선 4자리)로 연결됩니다.<br>
  업데이트: <span id="srcLabel"></span> · 총 <span id="totalLabel"></span>건 · 자동 추출본(오탈자 발견 시 총무팀으로 알려주세요)
</footer>

<div class="toast" id="toast">즐겨찾기에 추가했어요</div>

<script>
(function(){
  "use strict";

  var CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
  function choseong(str){
    var out = "";
    for (var i=0;i<str.length;i++){
      var code = str.charCodeAt(i) - 0xAC00;
      out += (code>=0 && code<=11171) ? CHO[Math.floor(code/588)] : str[i];
    }
    return out;
  }
  function flat(s){ return (s||"").replace(/\s+/g,"").toLowerCase(); }
  // 서울 지역번호 02 + 대표번호 2007 뒤에 내선 4자리를 붙여야 외부 휴대폰에서 실제로 연결된다
  var DID_PREFIX = "022007";
  function primaryExt(ext){
    var m = (ext||"").match(/\d{4}/) || (ext||"").match(/\d{2,}/);
    return m ? m[0] : "";
  }
  function telHref(ext){
    var p = primaryExt(ext);
    if (!p || p.length !== 4) return "";
    return "tel:" + DID_PREFIX + p;
  }
  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function itemKey(it){ return it.dept + "|" + it.name + "|" + it.ext; }

  var listEl = document.getElementById("list");
  var emptyEl = document.getElementById("empty");
  var qEl = document.getElementById("q");
  var chipsEl = document.getElementById("chips");
  var metaCount = document.getElementById("metaCount");
  var searchbar = document.getElementById("searchbar");
  var clearBtn = document.getElementById("clearBtn");
  var toastEl = document.getElementById("toast");
  var fontBtn = document.getElementById("fontBtn");

  var ALL = [];
  var activeFilter = "전체"; // "전체" | "즐겨찾기" | a section name
  var toastTimer = null;

  var FAV_KEY = "mizmedi_ext_favorites";
  function loadFavs(){
    try{
      var raw = localStorage.getItem(FAV_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveFavs(set){
    try{ localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(set))); }catch(e){}
  }
  var favs = new Set(loadFavs());

  try{
    if (localStorage.getItem("mizmedi_ext_textlg") === "1"){
      document.body.classList.add("text-lg");
    }
  }catch(e){}
  fontBtn.addEventListener("click", function(){
    var on = document.body.classList.toggle("text-lg");
    try{ localStorage.setItem("mizmedi_ext_textlg", on ? "1" : "0"); }catch(e){}
  });

  function render(){
    var q = flat(qEl.value);
    var qCho = choseong(q);
    var rawQ = qEl.value.trim();
    var rows = ALL.filter(function(it){
      if (activeFilter === "즐겨찾기") return favs.has(itemKey(it));
      if (activeFilter !== "전체" && it.section !== activeFilter) return false;
      if (!q) return true;
      if (it._flat.indexOf(q) !== -1) return true;
      if (it._cho.indexOf(qCho) !== -1 && qCho.length>0) return true;
      if (it.ext.indexOf(rawQ) !== -1 && rawQ) return true;
      return false;
    });

    // 이름을 정확히 다 입력했으면(예: "이정철") 비슷한 이름까지 다 보여주지 않고
    // 그 이름과 정확히 같은 사람만 남긴다. 동명이인이면 그 사람들만 나온다.
    if (rawQ && activeFilter !== "즐겨찾기"){
      var exact = rows.filter(function(it){ return it.name === rawQ; });
      if (exact.length) rows = exact;
    }

    metaCount.textContent = rows.length + "건";
    emptyEl.hidden = rows.length !== 0;
    if (rows.length === 0){
      emptyEl.innerHTML = activeFilter === "즐겨찾기"
        ? "<b>즐겨찾기가 비어있어요</b>번호 옆 별표를 눌러 추가해보세요."
        : "<b>검색 결과가 없어요</b>이름, 부서명, 초성 또는 내선번호로 다시 찾아보세요.";
    }

    var html = "";
    var lastDept = null;

    // 부서별로 묶어서 보여주되, 원래 추출 순서를 그대로 유지한다(병원 공식 순서).
    for (var i=0;i<rows.length;i++){
      var it = rows[i];
      if (it.dept !== lastDept){
        // 같은 부서 뒤에 몇 명이 더 있는지 미리 센다
        var cnt = 1;
        for (var j=i+1;j<rows.length && rows[j].dept===it.dept;j++) cnt++;
        html += '<div class="grouphead">' +
          '<span class="dname">' + escapeHtml(it.dept || "기타") + '</span>' +
          '<span class="dsec">' + escapeHtml(it.section) + '</span>' +
          '<span class="dcount">' + cnt + '</span>' +
        '</div>';
        lastDept = it.dept;
      }

      var href = telHref(it.ext);
      var subParts = [];
      if (it.room && it.room !== it.dept) subParts.push(escapeHtml(it.room));
      if (it.role) subParts.push(escapeHtml(it.role));
      if (it.task) subParts.push(escapeHtml(it.task));
      if (it.loc) subParts.push(escapeHtml(it.loc));
      var subHtml = subParts.map(function(s){return '<span class="seg">'+s+'</span>';}).join("");

      var key = itemKey(it);
      var isFav = favs.has(key);

      html += '<div class="row">' +
        '<div class="rinfo"><div class="rname">' + escapeHtml(it.display) + '</div>' +
        '<div class="rsub">' + (subHtml || "&nbsp;") + '</div></div>' +
        (href ? '<a class="bignum" href="'+href+'">'+escapeHtml(it.ext)+'</a>'
              : '<span class="bignum">'+escapeHtml(it.ext||"-")+'</span>') +
        '<button class="starbtn' + (isFav?' on':'') + '" data-key="' + escapeHtml(key) + '" aria-label="즐겨찾기" type="button">' + starIcon(isFav) + '</button>' +
      '</div>';
    }
    listEl.innerHTML = html;
  }

  function starIcon(filled){
    return filled
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.6 7.2.6-5.5 4.8 1.7 7-6.3-3.9-6.3 3.9 1.7-7-5.5-4.8 7.2-.6z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5l2.9 6.6 7.2.6-5.5 4.8 1.7 7-6.3-3.9-6.3 3.9 1.7-7-5.5-4.8 7.2-.6z"/></svg>';
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1300);
  }

  listEl.addEventListener("click", function(e){
    var btn = e.target.closest(".starbtn");
    if (!btn) return;
    var key = btn.getAttribute("data-key");
    if (favs.has(key)){
      favs.delete(key);
      showToast("즐겨찾기에서 뺐어요");
    } else {
      favs.add(key);
      showToast("즐겨찾기에 추가했어요");
    }
    saveFavs(favs);
    buildChips();
    render();
  });

  qEl.addEventListener("input", function(){
    searchbar.classList.toggle("has-text", !!qEl.value);
    render();
  });
  clearBtn.addEventListener("click", function(){
    qEl.value = ""; searchbar.classList.remove("has-text"); qEl.focus(); render();
  });

  var sectionsCache = [];
  function buildChips(){
    var html = '<button class="chip" data-s="전체" aria-pressed="' + (activeFilter==="전체") + '" type="button">전체</button>';
    html += '<button class="chip" data-s="즐겨찾기" aria-pressed="' + (activeFilter==="즐겨찾기") + '" type="button">' +
            '<span class="star">★</span>즐겨찾기 ' + favs.size + '</button>';
    sectionsCache.forEach(function(s){
      html += '<button class="chip" data-s="'+escapeHtml(s)+'" aria-pressed="'+(s===activeFilter)+'" type="button">'+escapeHtml(s)+'</button>';
    });
    chipsEl.innerHTML = html;
  }
  chipsEl.addEventListener("click", function(e){
    var b = e.target.closest(".chip");
    if (!b) return;
    activeFilter = b.getAttribute("data-s");
    render();
    buildChips();
  });

  function parseAsOf(filename){
    var m = (filename||"").match(/(\d{2})\.(\d{2})\.\d{2}/);
    if (!m) return "";
    return "20" + m[1] + "." + m[2] + " 기준";
  }

  function boot(data){
    ALL = data.items.map(function(it){
      it._flat = flat(it.search);
      it._cho = flat(it.searchCho);
      return it;
    });
    // 정렬하지 않고 PDF 원래 순서(부서별로 이미 묶여있음)를 그대로 유지한다.

    var sections = [];
    ALL.forEach(function(it){ if (sections.indexOf(it.section) === -1) sections.push(it.section); });
    sectionsCache = sections;
    buildChips();

    document.getElementById("srcLabel").textContent = data.generatedFrom || "";
    document.getElementById("totalLabel").textContent = data.count;
    document.getElementById("asOf").textContent = parseAsOf(data.generatedFrom);

    render();
  }

  fetch("directory.json").then(function(r){ return r.json(); }).then(boot).catch(function(err){
    listEl.innerHTML = "";
    emptyEl.hidden = false;
    emptyEl.innerHTML = "<b>데이터를 불러오지 못했어요</b>directory.json 파일을 확인해주세요.";
    console.error(err);
  });

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
